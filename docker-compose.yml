version: '3.8'
services:
  mc-server:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      MEMORY: "2G"
    volumes:
      - ./mc-data:/data
    networks:
      - mcnet

  mc-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mc-server
    environment:
      TARGET_HOST: mc-server
      TARGET_PORT: 25565
    ports:
      - "25566:25566" # 代理监听端口（可在生产环境移除外部映射，仅由 cloudflared 访问）
    networks:
      - mcnet

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --no-autoupdate --config /etc/cloudflared/config.yml my-tunnel
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - mc-proxy
    networks:
      - mcnet

networks:
  mcnet:
    driver: bridge
